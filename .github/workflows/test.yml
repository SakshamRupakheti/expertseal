name: Extension checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - run: npm ci
        working-directory: companion
      - run: npm run check
        working-directory: companion
      - run: npm test
        working-directory: companion
      - uses: actions/upload-artifact@v4
        with:
          name: expertseal-extension
          path: dist/*.zip
